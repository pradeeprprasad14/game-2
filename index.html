<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tarazu - The Balance Scale Game | तराजू का खेल</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Yatra+One&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <!-- Top Header Bar -->
    <header id="top-bar">
      <div class="header-left">
        <button id="btn-home" class="icon-btn" title="Levels Menu" aria-label="Levels Menu">
          <span class="btn-icon">🏠</span>
          <span class="btn-text" data-i18n="menu">Menu</span>
        </button>
        <div class="level-badge">
          <span id="level-label" data-i18n="level">Level</span>
          <span id="level-number">1</span>
        </div>
      </div>

      <!-- Mascot & Speech Banner -->
      <div class="mascot-speech-container">
        <div class="mascot-avatar" id="mascot-avatar" title="Mithoo">
          🦜
        </div>
        <div class="speech-bubble" id="speech-bubble">
          <p id="speech-text">Balance the scale!</p>
          <button id="btn-speak" class="speak-btn" title="Listen again" aria-label="Listen audio">
            🔊
          </button>
        </div>
      </div>

      <!-- Header Controls: Language & Sound -->
      <div class="header-right">
        <!-- Language Switcher -->
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">हिन्दी</button>
          <button class="lang-btn" data-lang="mr">मराठी</button>
        </div>
        <button id="btn-sound" class="icon-btn" title="Toggle Sound">
          <span id="sound-icon">🔔</span>
        </button>
        <button id="btn-mode-toggle" class="icon-btn highlight-btn" title="Sandbox Free Play">
          <span>⚖️</span>
          <span id="mode-text" data-i18n="sandbox">Free Play</span>
        </button>
      </div>
    </header>

    <!-- Sub-bar for Multi-Way challenge progress & level hint -->
    <div id="sub-bar">
      <div id="challenge-status" class="challenge-status hidden">
        <span class="challenge-badge active" id="way-1-badge">Way 1: ⭐</span>
        <span class="challenge-badge" id="way-2-badge">Way 2: ❓</span>
      </div>
      <div id="status-hint" class="status-hint">
        <span id="needle-hint-icon">⚖️</span>
        <span id="hint-text">Add weights to balance both pans!</span>
      </div>
      <button id="btn-reset" class="action-btn small-btn" title="Reset Scale">
        <span>🔄</span> <span data-i18n="reset">Reset</span>
      </button>
    </div>

    <!-- Main Scale Stage (SVG + Physics) -->
    <main id="scale-stage">
      <!-- Traditional Arch Background Motif -->
      <div class="bazaar-awning"></div>

      <!-- Interactive Scale SVG -->
      <svg id="scale-svg" viewBox="0 0 900 480" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Gradients for brass / traditional metal finish -->
          <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF2A3"/>
            <stop offset="35%" stop-color="#E5A93C"/>
            <stop offset="70%" stop-color="#B87318"/>
            <stop offset="100%" stop-color="#7A4805"/>
          </linearGradient>

          <linearGradient id="woodStand" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#582C0E"/>
            <stop offset="30%" stop-color="#8B4513"/>
            <stop offset="70%" stop-color="#A0522D"/>
            <stop offset="100%" stop-color="#4A250B"/>
          </linearGradient>

          <linearGradient id="panShade" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FCE185"/>
            <stop offset="50%" stop-color="#D4942B"/>
            <stop offset="100%" stop-color="#8E5B10"/>
          </linearGradient>

          <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#301500" flood-opacity="0.3"/>
          </filter>

          <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22C55E" flood-opacity="0.8"/>
          </filter>
        </defs>

        <!-- Stand Base & Central Pillar (Fixed) -->
        <g id="stand-group" filter="url(#shadow)">
          <!-- Wooden base platform -->
          <path d="M 330 460 L 570 460 C 585 460 590 472 580 475 L 320 475 C 310 472 315 460 330 460 Z" fill="url(#woodStand)"/>
          <ellipse cx="450" cy="460" rx="140" ry="12" fill="#3D1D06" opacity="0.6"/>
          
          <!-- Central pillar -->
          <rect x="440" y="100" width="20" height="360" rx="6" fill="url(#brassGold)"/>
          <!-- Pillar carved decorative rings -->
          <ellipse cx="450" cy="180" rx="18" ry="6" fill="#FCE185"/>
          <ellipse cx="450" cy="270" rx="18" ry="6" fill="#FCE185"/>
          <ellipse cx="450" cy="370" rx="20" ry="7" fill="#FCE185"/>

          <!-- Top bracket / Crown -->
          <path d="M 425 105 Q 450 65 475 105 Z" fill="url(#brassGold)"/>
          <circle cx="450" cy="80" r="16" fill="url(#brassGold)"/>
          <circle cx="450" cy="80" r="8" fill="#4A250B"/>
          
          <!-- Balance Dial / Indicator Center Arc -->
          <path d="M 410 95 A 40 40 0 0 1 490 95" stroke="#7A4805" stroke-width="4" fill="none"/>
          <circle cx="450" cy="55" r="5" id="center-indicator-pip" fill="#E5A93C"/>
        </g>

        <!-- Tilting Beam Group (Rotates around (450, 80)) -->
        <g id="beam-group" transform="rotate(0, 450, 80)">
          <!-- Main horizontal beam (Dandi) -->
          <path d="M 120 76 L 780 76 Q 785 80 780 84 L 120 84 Q 115 80 120 76 Z" fill="url(#brassGold)" filter="url(#shadow)"/>
          <!-- Beam center ring -->
          <circle cx="450" cy="80" r="14" fill="url(#brassGold)" stroke="#663A04" stroke-width="2"/>
          <circle cx="450" cy="80" r="5" fill="#FFF"/>

          <!-- Balance Needle Pointer (Points straight UP to center pip when level) -->
          <polygon id="balance-needle" points="447,80 453,80 450,30" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
          <circle cx="450" cy="30" r="4" fill="#EF4444"/>

          <!-- Left Chain Hook -->
          <circle cx="150" cy="80" r="8" fill="url(#brassGold)"/>
          <circle cx="150" cy="80" r="4" fill="#3D1D06"/>

          <!-- Right Chain Hook -->
          <circle cx="750" cy="80" r="8" fill="url(#brassGold)"/>
          <circle cx="750" cy="80" r="4" fill="#3D1D06"/>
        </g>

        <!-- Left Pan Assembly (Hangs vertically from Left Hook, Y shifts with tilt) -->
        <g id="left-pan-group">
          <!-- Hanging Chains (3 strands) -->
          <line id="left-chain-1" x1="150" y1="80" x2="80" y2="280" stroke="#B87318" stroke-width="2.5" stroke-dasharray="4,2"/>
          <line id="left-chain-2" x1="150" y1="80" x2="150" y2="283" stroke="#9A5D0D" stroke-width="2" stroke-dasharray="4,2"/>
          <line id="left-chain-3" x1="150" y1="80" x2="220" y2="280" stroke="#B87318" stroke-width="2.5" stroke-dasharray="4,2"/>

          <!-- Brass Pan Body (Palda) -->
          <ellipse cx="150" cy="285" rx="80" ry="16" fill="url(#panShade)" filter="url(#shadow)"/>
          <ellipse cx="150" cy="283" rx="76" ry="13" fill="#FFE28A" opacity="0.4"/>
          <!-- Rim ring -->
          <ellipse cx="150" cy="285" rx="80" ry="16" stroke="#7A4805" stroke-width="2" fill="none"/>

          <!-- Visual Drop Zone Highlight for Left Pan -->
          <ellipse id="left-drop-zone" cx="150" cy="275" rx="75" ry="30" fill="transparent" class="drop-target-area"/>
        </g>

        <!-- Right Pan Assembly (Hangs vertically from Right Hook, Y shifts with tilt) -->
        <g id="right-pan-group">
          <!-- Hanging Chains (3 strands) -->
          <line id="right-chain-1" x1="750" y1="80" x2="680" y2="280" stroke="#B87318" stroke-width="2.5" stroke-dasharray="4,2"/>
          <line id="right-chain-2" x1="750" y1="80" x2="750" y2="283" stroke="#9A5D0D" stroke-width="2" stroke-dasharray="4,2"/>
          <line id="right-chain-3" x1="750" y1="80" x2="820" y2="280" stroke="#B87318" stroke-width="2.5" stroke-dasharray="4,2"/>

          <!-- Brass Pan Body (Palda) -->
          <ellipse cx="750" cy="285" rx="80" ry="16" fill="url(#panShade)" filter="url(#shadow)"/>
          <ellipse cx="750" cy="283" rx="76" ry="13" fill="#FFE28A" opacity="0.4"/>
          <!-- Rim ring -->
          <ellipse cx="750" cy="285" rx="80" ry="16" stroke="#7A4805" stroke-width="2" fill="none"/>

          <!-- Visual Drop Zone Highlight for Right Pan -->
          <ellipse id="right-drop-zone" cx="750" cy="275" rx="75" ry="30" fill="transparent" class="drop-target-area"/>
        </g>
      </svg>

      <!-- HTML Overlays for Dynamic Pan Items (Supports touch drag, click-to-remove) -->
      <div id="pan-overlay-left" class="pan-overlay" data-pan="left">
        <div class="pan-items-shelf" id="left-pan-items"></div>
        <div class="pan-weight-tag" id="left-weight-badge">
          <span class="weight-value">0</span> <span class="unit">kg</span>
        </div>
      </div>

      <div id="pan-overlay-right" class="pan-overlay" data-pan="right">
        <div class="pan-items-shelf" id="right-pan-items"></div>
        <div class="pan-weight-tag" id="right-weight-badge">
          <span class="weight-value">0</span> <span class="unit">kg</span>
        </div>
      </div>

      <!-- Center Balance Status Ring & Check Button -->
      <div id="center-fulcrum-hud">
        <div id="balance-glow-indicator" class="hud-circle" title="Balance Status">
          <span id="balance-emoji">⚖️</span>
        </div>
      </div>
    </main>

    <!-- Bottom Tray: Available Weights & Produce Shelf -->
    <footer id="bottom-shelf">
      <div class="shelf-header">
        <span class="shelf-title" data-i18n="tray_title">Pick & Drag Weights:</span>
        <span class="shelf-sub" data-i18n="tray_hint">(Tap or drag onto scale pans)</span>
      </div>
      <div id="weights-tray" class="weights-tray">
        <!-- Dynamically injected weight tokens -->
      </div>
    </footer>

    <!-- Level Complete Modal / Win Screen -->
    <div id="modal-celebration" class="modal-backdrop hidden">
      <div class="modal-card celebration-card">
        <div class="confetti-cannon" id="confetti-container"></div>
        <div class="win-star-row">
          <span class="star-pop">⭐</span>
          <span class="star-pop delay-1">🌟</span>
          <span class="star-pop delay-2">⭐</span>
        </div>
        <h2 id="win-title" data-i18n="win_title">Shabaash! Perfect Balance!</h2>
        <p id="win-msg" data-i18n="win_desc">Both sides are equal!</p>
        <div class="win-equation" id="win-equation">5 kg = 2 kg + 3 kg</div>
        <div class="modal-actions">
          <button id="btn-replay-level" class="action-btn secondary-btn">
            <span>🔄</span> <span data-i18n="replay">Again</span>
          </button>
          <button id="btn-next-level" class="action-btn primary-btn pulse-glow">
            <span>▶️</span> <span data-i18n="next">Next Level</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Levels Menu Modal -->
    <div id="modal-levels" class="modal-backdrop hidden">
      <div class="modal-card levels-card">
        <div class="modal-header">
          <h2 data-i18n="choose_level">Choose a Level</h2>
          <button id="btn-close-levels" class="close-btn" aria-label="Close">✕</button>
        </div>
        <div class="stages-tabs">
          <button class="stage-tab active" data-stage="1" data-i18n="stage_1">Basic (1-5 kg)</button>
          <button class="stage-tab" data-stage="2" data-i18n="stage_2">Bazaar Items</button>
          <button class="stage-tab" data-stage="3" data-i18n="stage_3">Mystery Box ❓</button>
          <button class="stage-tab" data-stage="4" data-i18n="stage_4">Two Ways 🌟</button>
        </div>
        <div id="levels-grid" class="levels-grid">
          <!-- Dynamic level buttons -->
        </div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
